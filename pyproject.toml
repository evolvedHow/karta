[project]
name = "karta"
version = "0.1.0"
description = "kartā — self-hostable agent platform control plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "sqlalchemy==2.1.9",
    "psycopg==3.3.9",
    "redis==8.1.0",
    "httpx==0.28.1",
    "pyyaml==6.0.4",
    "click==8.5.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[project.scripts]
karta = "karta.cli:main"
karta-api = "karta.api:run"
karta-worker = "karta.worker:run"
karta-migrate = "karta.db:run_migrations_cli"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/karta"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D"]
ignore = ["D203", "D213"]

[tool.pytest.ini_options]
testpaths = ["tests"]
