[project]
name = "karta-milestone0-spike"
version = "0.1.0"
description = "Milestone 0 compatibility spike tooling for kartā"
requires-python = ">=3.11"
dependencies = [
    "openlit==1.45.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "opentelemetry-proto==1.45.2",
    "protobuf==6.33.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D"]
ignore = ["D203", "D213"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
